<script language="JavaScript">
<!--hide this script from non-javascript-enabled browsers

/* Function that displays status bar messages. */
function MM_displayStatusMsg(msgStr)  { //v3.0
	status=msgStr; document.MM_returnValue = true;
}

function MM_findObj(n, d) { //v3.0
  var p,i,x;  if(!d) d=document; if((p=n.indexOf("?"))>0&&parent.frames.length) {
    d=parent.frames[n.substring(p+1)].document; n=n.substring(0,p);}
  if(!(x=d[n])&&d.all) x=d.all[n]; for (i=0;!x&&i<d.forms.length;i++) x=d.forms[i][n];
  for(i=0;!x&&d.layers&&i<d.layers.length;i++) x=MM_findObj(n,d.layers[i].document); return x;
}
/* Functions that swaps down images. */
function MM_nbGroup(event, grpName) { //v3.0
  var i,img,nbArr,args=MM_nbGroup.arguments;
  if (event == "init" && args.length > 2) {
    if ((img = MM_findObj(args[2])) != null && !img.MM_init) {
      img.MM_init = true; img.MM_up = args[3]; img.MM_dn = img.src;
      if ((nbArr = document[grpName]) == null) nbArr = document[grpName] = new Array();
      nbArr[nbArr.length] = img;
      for (i=4; i < args.length-1; i+=2) 
        if ((img = MM_findObj(args[i])) != null) {
            if (!img.MM_up) img.MM_up = img.src;
            img.src = img.MM_dn = args[i+1];
            nbArr[nbArr.length] = img;
        } 
    }
  } else if (event == "over") {
    document.MM_nbOver = nbArr = new Array();
    for (i=1; i < args.length-1; i+=3) if ((img = MM_findObj(args[i])) != null) {
      if (!img.MM_up) img.MM_up = img.src;
      img.src = (img.MM_dn && args[i+2]) ? args[i+2] : args[i+1];
      nbArr[nbArr.length] = img;
    }
  } else if (event == "out" ) {
    for (i=0; i < document.MM_nbOver.length; i++) {
      img = document.MM_nbOver[i]; img.src = (img.MM_dn) ? img.MM_dn : img.MM_up; }

  } else if (event == "down") {
    if ((nbArr = document[grpName]) != null)
      for (i=0; i < nbArr.length; i++) { img=nbArr[i]; img.src = img.MM_up; img.MM_dn = 0; }
    document[grpName] = nbArr = new Array();
    for (i=2; i < args.length-1; i+=2) if ((img = MM_findObj(args[i])) != null) {
      if (!img.MM_up) img.MM_up = img.src;
      img.src = img.MM_dn = args[i+1];
      nbArr[nbArr.length] = img;
    }
    this.focus();
    }
}

function initThePage()  {
   var MB = document.MenuBtns = new Array();
   MB[0]  = "BtnHome";
   MB[1]  = "BtnTinfo";
   MB[2]  = "BtnChat";
   MB[3]  = "BtnIrcHelp";
   MB[4]  = "BtnPeople";
   MB[5]  = "BtnTrt";
   MB[6]  = "BtnYahoo";
   MB[7]  = "BtnMeet1";
   MB[8]  = "BtnBabies";
   MB[9]  = "BtnSounds";
   MB[10] = "BtnHallow";

   if (document.images) { 
       if(!document.MM_p) document.MM_p=new Array();
       var i,j=document.MM_p.length; 
       for(i=0; i<MB.length; i++)  {
           document.MM_p[j]=new Image; 
           document.MM_p[j++].src="buttons/" + MB[i] + "D.gif";
           document.MM_p[j]=new Image; 
           document.MM_p[j++].src="buttons/" + MB[i] + "O.gif";
           document.MM_p[j]=new Image; 
           document.MM_p[j++].src="buttons/" + MB[i] + "U.gif";
       }
   }
   parent.frames["body"].location= "tmain.html";
}
// stop hiding
