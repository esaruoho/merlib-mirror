<HTML><HEAD><TITLE>Do JavaScript</TITLE><SCRIPT LANGUAGE="JavaScript">function getSelectionText(selectObj){	return selectObj.options[selectObj.selectedIndex].text}// the main functionfunction DoJavaScript(form) {	var frame    = parent.frames[1]  // Hard coded number!? BOO HISS	var frameDoc = frame.document	var result   = ""		// Assemble content for bottom frame	result = "<BODY>"	result +=form.JS.value	result += "</BODY>"	// Write the data	frameDoc.writeln(form.JS.value)	// This doc.close() appears to flush all frame text to the screen	// if it is left out we may not see all the text.	// Bug or feature?	frameDoc.close()}</SCRIPT></HEAD><BODY><A HREF="index.html">Class overview</A><br><H1>Calendar Example - substring()</H1>The HTML uses the JavaScript substring() method to get part of a string<FORM name=exec><textarea NAME="JS" cols=60 rows=12 ALIGN="center"><HEAD><ScRiPt>function Do_Calendar(){   // document.open()   var today      = new Date();   var day        = today.getDate();   var month      = today.getMonth();   var year       = today.getYear(); // + 1900;//***** NEW *****   var monthNames = "JanFebMarAprMayJunJulAugSepOctNovDec";   month = monthNames.substring(3*month, 3*(month + 1))//****************   document.write(today.toString() + "<br>")   document.write("day = " + day + " month = " + month + " year = " + year + "<br>")   document.write("<CENTER>");   document.write("<TABLE BORDER>");   document.write("<TR><TH COLSPAN=7>");   document.write("Jan 2000");   document.write("<TR><TH>Sun<TH>Mon<TH>Tue<TH>Wed<TH>Thu<TH>Fri<TH>Sat");   document.write("<TR><TD><TD><TD><TD><TD><TD><TD>1");   document.write("<TR><TD>2<TD>3<TD>4<TD>5<TD>6<TD>7<TH>8");   document.write("<TR><TD>9<TD>10<TD>11<TD>12<TD>13<TD>14<TH>15");   document.write("<TR><TD>16<TD>17<TD>18<TD>19<TD>20<TD>21<TH>22");   document.write("<TR><TD>23<TD>24<TD>25<TD>26<TD>27<TD>28<TH>29");   document.write("<TR><TD>30<TD>31<TD><TD><TD><TD><TD>");      document.write("</TABLE>");   document.writeln("</CENTER>");   // document.close()}</SCRIPT></HEAD><BODY>This is a calendar for Jan 2000<br><SCRIPT>Do_Calendar()</SCRIPT></BODY></textarea><INPUT TYPE="button" NAME="Do it" VALUE="Do it" ALIGN="center" onClick=DoJavaScript(this.form)><INPUT TYPE=Reset NAME="Reset"></FORM><em> Assignment</em><br>Modify the JavaScript so the calendar uses the variables <em>month</em> and <em>year</em>for the heading, then press <em>Do it</em> to see it written below.</HTML>
