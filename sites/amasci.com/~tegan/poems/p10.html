<center><h1>Another Life</h1></center>
<ul>
<li><a href="#poem1">Seattle Haiku</a>
</ul>
<p>

<a name="poem1"><hr></a>
<p><pre>
   Storm in Seattle
 Whitecaps on the reservoir
   Cars shake off the rain.

                 Goth with umbrella
               Waiting for her bus to come
                 It is late again.
</pre>
