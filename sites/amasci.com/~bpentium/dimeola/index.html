<H3>About Al Di Meola: 
</H3>
<P>A native of New Jersey, Al Di Meola replaced Bill Conners in Chick Corea's &quot;Return
 To Forever&quot; at age 19. he left in 1976 after recording three albums with 
the group. During the four years following , his concert tours and solo LP's 
(including 
<I>Land of the Midnight Sun, Elegant Gypsy, Casino, and Splendido Hotel</I>) 
has brought him four straight wins as Best Jazz Guitarist in the <I>Guitar 
Player</I> Readers Poll, as well as three awards for the Best Guitar Albums. 
</P>
<P> His albums have explored a variety of styles,but his best liked albums are 
the latin influenced fusion albums which are his first through Tour De Force, 
plus the recent Kiss My Axe (you'll have to forgive the title). Cielo E Terra 
and Soaring Through a Dream explore world musics, while Scenario and Tirami Su 
have some of the edge removed. The fusion albums have a slight degree of 
sameness. He just doesn't seem to be able to channel that fiery style into any 
stylistic changes. But that doesn't mean he's not worth hearing! Get Elegant 
Gypsy (my favorite) or Casino. You won't be disappointed if you like guitar 
fusion or just good guitar ability Electric Rendezvous and Kiss My Axe are 
incredible albums from one of the best fusion guitarists alive.</P>
