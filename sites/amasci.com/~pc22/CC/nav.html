function queryClimbsDB(Branch,Class) {

var currDate=new Date()
var queryString="/mountaineers/"
var queryHost="http://larch.forest.net"

queryString+="FMPro?-DB=Trips98_.fp4"
queryString+="&-Format=trip_schedule2.htm"
queryString+="&-Lay="
queryString+=escape("Trip Signup View")
queryString+="&-Op=gt"
queryString+="&Date="
queryString+=1+currDate.getMonth() 
queryString+="/"
queryString+=currDate.getDate()
queryString+="/"
queryString+=currDate.getYear()
if (Class != "") {
   queryString+="&TripClass="
   queryString+=Class
   }
if (Branch != "") {
   queryString+="&Branch="
   queryString+=Branch
   }
queryString+="&-Max=20"
queryString+="&-SortField=Date"
queryString+="&-Find"

// alert(queryString)
 
window.location = queryHost + queryString
}
