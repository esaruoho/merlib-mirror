<H1>Gary on Red Mountain</H1>

<P>Red Mountain is 5890 ft tall and located 3 mi NE of Snoqualmie Pass.  It is a class 3 climb.  Gary and Dad climbed to the top on 6/22/98.  Gary was 14 at the time.  Behind Gary is Kendall Peak. The rocks on top of Red Mountain were slippery and crumbly
