<meta name="description" content="Die Welt als verkoppelte Wirbel, zusammen sind/ist wir/es EIN Netz aus Wirbeln in vielen Hierarchien, als Sub- und Ueberwirbel. Man sieht jeweils nur die Wirbelkerne. Zweck des Vereins ist die Förderung von Wissenschaft und Forschung, Volksbildung, Kunst und Kultur, Landschaftspflege, Umweltschutz, des Gesundheitswesens, die Erhaltung und Pflege von Kulturgütern jeder Art, insbesondere auch der mündlichen und schriftlichen Überlieferungen von Zivilisationen und Kulturen aus allen Zeitepochen und Regionen, die Pflege des interkulturellen Austauschs und die Vermittlung zwischen den verschiedenen wissenschaftlichen Disziplinien und Fakultäten sowie die Unterstützung eines ganzheitlichen und fächerübergreifenden Wissenschaftsverständnisses.">
